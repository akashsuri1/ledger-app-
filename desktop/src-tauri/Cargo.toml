[package]
name = "ledgerflow-desktop"
version = "0.1.0"
description = "LedgerFlow Windows desktop application"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rand = "0.9.2"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
