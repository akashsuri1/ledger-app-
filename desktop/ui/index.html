<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting LedgerFlow</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; background:#f8fafc; color:#0f172a; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#eff6ff,#f8fafc 55%); }
      main { width:min(430px,calc(100vw - 48px)); text-align:center; padding:40px; border:1px solid #dbeafe; border-radius:24px; background:rgba(255,255,255,.92); box-shadow:0 20px 60px rgba(15,23,42,.10); }
      .mark { width:64px; height:64px; margin:auto; display:grid; place-items:center; border-radius:18px; background:#0f3b73; color:white; font-weight:800; font-size:25px; letter-spacing:-2px; }
      h1 { margin:22px 0 8px; font-size:28px; }
      p { margin:0; color:#64748b; line-height:1.6; }
      .loader { width:180px; height:4px; margin:28px auto 0; overflow:hidden; border-radius:999px; background:#e2e8f0; }
      .loader::after { content:""; display:block; width:45%; height:100%; border-radius:inherit; background:#2563eb; animation:load 1.25s ease-in-out infinite; }
      @keyframes load { from { transform:translateX(-110%); } to { transform:translateX(330%); } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">LF</div>
      <h1>Starting LedgerFlow</h1>
      <p>Opening your secure local ledger and checking the database.</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
